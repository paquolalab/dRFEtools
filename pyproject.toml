[tool.poetry]
name = "dRFEtools"
version = "0.4.1"
description = "Dynamic recursive feature elimination utilities built on scikit-learn."
authors = [
    "Kynon JM Benjamin <kj.benjamin90@gmail.com>",
    "Apuã Paquola <apua.paquola@libd.org>"
]
maintainers = ["Kynon JM Benjamin <kj.benjamin90@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["feature selection", "recursive feature elimination", "sklearn"]
packages = [{ include = "dRFEtools" }]

[tool.poetry.scripts]
drfetools = "dRFEtools.cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
numpy = ">=2.0"
pandas = ">=2.0"
matplotlib = ">=3.8"
plotnine = ">=0.13"
pillow = ">=13.0.0"
scikit-learn = ">=1.5.0"
scipy = ">=1.11"
statsmodels = ">=0.14"

[tool.poetry.urls]
homepage = "https://drfetools.readthedocs.io"
repository = "https://github.com/LieberInstitute/dRFEtools"
"Bug Tracker" = "https://github.com/paquolalab/dRFEtools/issues"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.docs.dependencies]
sphinx = ">=8,<9"
sphinx-rtd-theme = ">=2,<4"
sphinx-autodoc-typehints = ">=2,<4"
certifi = ">=2026.10.19"
idna = ">=3.15"
pygments = ">=2.20.0"
requests = ">=2.33.0"
urllib3 = ">=2.8.0"

[tool.poetry-dynamic-versioning]
enable = false
