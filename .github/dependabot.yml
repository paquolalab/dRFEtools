version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
